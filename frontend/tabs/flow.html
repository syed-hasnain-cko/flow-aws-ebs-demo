<div class="context-area">
    <div class="inline-form">
        <div class="form-group">
            <label for="name-input" class="text-label">Name</label>
            <input type="text" id="name-input" class="text-input" value="Syed Hasnain">
        </div>
        <div class="form-group">
            <label for="email-input" class="text-label">Email</label>
            <input type="email" id="email-input" class="text-input" value="syed.hasnain@checkout.com">
        </div>
        <div class="form-group">
            <label for="amount-input" class="text-label">Amount</label>
            <input type="text" id="amount-input" class="text-input" value="100">
        </div>
        <div class="form-group">
            <label for="payment-type-select" class="select-label">Payment Type</label>
            <select id="payment-type-select" class="select-input">
                <option value="Regular" selected>Regular</option>
                <option value="Recurring">Recurring</option>
                <option value="Unscheduled">Unscheduled</option>
                <option value="Installment">Installment</option>
            </select>
        </div>
    </div>
    <div class="inline-form">
        <div class="form-group">
            <label for="3ds-toggle" class="toggle-label">3DS</label>
            <label class="switch">
                <input type="checkbox" id="3ds-toggle">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="form-group">
            <label for="capture-toggle" class="toggle-label">Capture</label>
            <label class="switch">
                <input type="checkbox" id="capture-toggle">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="form-group">
            <label for="country-select" class="select-label">Country</label>
            <select id="country-select" class="select-input"></select>
        </div>
        <div class="form-group">
            <label for="currency-select" class="select-label">Currency</label>
            <select id="currency-select" class="select-input"></select>
        </div>
        <div class="form-group">
            <label for="flow-locale-select" class="select-label">Language (Locale)</label>
            <select id="flow-locale-select" class="select-input">
                <option value="ar">Arabic</option>
                <option value="zh">Chinese (Simplified)</option>
                <option value="zh-HK">Chinese (Hong Kong)</option>
                <option value="zh-TW">Chinese (Taiwan)</option>
                <option value="da-DK">Danish</option>
                <option value="nl-NL">Dutch</option>
                <option value="en-GB" selected>English</option>
                <option value="fil-PH">Filipino</option>
                <option value="fi-FI">Finnish</option>
                <option value="fr-FR">French</option>
                <option value="de-DE">German</option>
                <option value="el-GR">Greek</option>
                <option value="hi-IN">Hindi</option>
                <option value="id-ID">Indonesian</option>
                <option value="it-IT">Italian</option>
                <option value="ja-JP">Japanese</option>
                <option value="ko-KR">Korean</option>
                <option value="ms-MY">Malay</option>
                <option value="no-NO">Norwegian</option>
                <option value="pl-PL">Polish</option>
                <option value="pt-PT">Portuguese</option>
                <option value="ro-RO">Romanian</option>
                <option value="ru-RU">Russian</option>
                <option value="es-ES">Spanish</option>
                <option value="sv-SE">Swedish</option>
                <option value="th-TH">Thai</option>
                <option value="tr-TR">Turkish</option>
                <option value="vi-VN">Vietnamese</option>
            </select>
        </div>
    </div>
    <div class="inline-form">
        <div class="form-group">
            <label for="remember-me-toggle" class="toggle-label">Enable Remember Me</label>
            <label class="switch">
                <input type="checkbox" id="remember-me-toggle">
                <span class="slider round"></span>
            </label>
        </div>
    </div>
    <div class="button-group">
        <button id="flow-button" class="main-button">Render Standard Flow</button>
        <button id="tokenize-only-button" class="main-button">Render Tokenize Only</button>
    </div>
</div>

<div id="flow-container" class="payment-container">
    <button id="tokenize-button" class="main-button" style="display: none;">Tokenize</button>
    <button id="pay-button" class="main-button" style="display: none;">Pay Now</button>
    <p class="success-payment-message"></p>
</div>
