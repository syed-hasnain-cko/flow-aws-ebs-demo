<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Demo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Theme: apply before first paint to prevent flash -->
    <script>
        (function () {
            var t = localStorage.getItem('cko-demo-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('cko-demo-theme', theme);
            var sel = document.getElementById('theme-selector');
            if (sel) sel.value = theme;
        }
    </script>
</head>
<body>

    <!-- App shell: filled synchronously by tabs/loader.js -->
    <div id="app"></div>

    <!-- 1. Inject all tab HTML before any module script runs -->
    <script src="tabs/loader.js"></script>
    <!-- Sync theme selector to saved value after it's injected -->
    <script>
        (function () {
            var t = localStorage.getItem('cko-demo-theme') || 'light';
            var sel = document.getElementById('theme-selector');
            if (sel) sel.value = t;
        })();
    </script>

    <!-- 2. App config: sets window.APP_CONFIG with env-specific values -->
    <script src="frontend-config.js"></script>

    <!-- 4. Checkout.com Web Components SDK -->
    <!-- <script src="https://checkout-web-components.cko-qa.ckotech.co/index.js"></script> -->
    <script src="https://checkout-web-components.sandbox.checkout.com/index.js"></script>
    

    <!-- 5. Shared utilities and data (must load before feature modules) -->
    <script src="utils.js"></script>
    <script src="modules/api-log.js"></script>
    <script src="modules/payment-actions.js"></script>
    <script src="modules/data.js"></script>

    <!-- 6. Feature modules -->
    <script src="modules/wallets.js"></script>
    <script src="modules/flow.js"></script>
    <script src="modules/payment-setup-config.js"></script>
    <script src="modules/payment-setup.js"></script>
    <script src="modules/payouts.js"></script>
    <script src="modules/forward-config.js"></script>

    <!-- JWE encryption bridge for the Forward API tab. The app otherwise uses
         plain scripts, but 'jose' ships as an ES module — this small module
         script imports it from a CDN and exposes a plain function on window
         so forward.js (a regular script) can call it like any other helper. -->
    <script type="module">
        import * as jose from 'https://cdn.jsdelivr.net/npm/jose@5/+esm';

        let _jwksCache = null;
        async function getJwk() {
            if (_jwksCache) return _jwksCache;
            const res = await fetch(`${window.APP_CONFIG?.apiBaseUrl || ''}/forward-jwks`);
            const jwks = await res.json();
            const keyProps = jwks.keys[0];
            _jwksCache = { kid: keyProps.kid, jwk: await jose.importJWK(keyProps) };
            return _jwksCache;
        }

        window.joseEncryptHeaders = async function (rawHeadersObj) {
            const { kid, jwk } = await getJwk();
            return await new jose.CompactEncrypt(new TextEncoder().encode(JSON.stringify(rawHeadersObj)))
                .setProtectedHeader({ alg: 'RSA-OAEP-256', enc: 'A256GCM', kid })
                .encrypt(jwk);
        };
    </script>
    <script src="modules/forward.js"></script>

    <!-- 7. Main entry: dropdown population + tab switching -->
    <script src="script.js"></script>

    <!-- 8. Wallet implementations -->
    <script src="google-pay.js"></script>
    <script src="apple-pay.js"></script>

</body>
</html>
